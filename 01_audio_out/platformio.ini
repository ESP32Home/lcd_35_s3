[env:esp32-s3-touch-lcd-35]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Arduino IDE equivalents:
; - USB CDC On Boot: Enabled
; - Flash Mode: QIO 80 MHz
; - Flash Size: 16 MB
; - Partition Scheme: 16M Flash (3MB APP/9.9MB FATFS)
; - PSRAM: OPI PSRAM

build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM

board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728
board_build.arduino.memory_type = qio_opi
board_build.partitions = ../partitions/partitions_16MB_3MBapp_9_9MB_fatfs.csv
board_build.filesystem = fatfs

lib_deps =
  schreibfaul1/ESP32-audioI2S@3.0.13

; ES8311 driver is not in the PlatformIO registry in this demo bundle.
; Reuse your existing Arduino library install instead of copying it.
lib_extra_dirs =
  ${sysenv.USERPROFILE}/Documents/Arduino/libraries

