[env:esp32-s3-touch-lcd-35]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM

board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728
board_build.arduino.memory_type = qio_opi
board_build.partitions = ../partitions/partitions_16MB_3MBapp_9_9MB_fatfs.csv
board_build.filesystem = fatfs

lib_deps =
  moononournation/GFX Library for Arduino@1.5.5
  robtillaart/TCA9554@0.1.2
  bitbank2/PNGdec@1.1.3

